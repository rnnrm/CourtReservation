name: Build and publish Docker image

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: CourtBooking.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/courtbooking-server:latest
            ghcr.io/${{ github.repository_owner }}/courtbooking-server:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/courtbooking-server:latest
          cache-to: type=inline

      - name: Image metadata (output)
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/courtbooking-server:${{ github.sha }}" >> $GITHUB_OUTPUT